<style>

}

/* =========================================================
AREA POPUP

.area-popup{

  position:fixed;

  top:90px;

  transform:
    translateX(-50%)

  z-index:999999;

  padding:18px 26px;

  border-radius:24px;

  background:
    rgba(15,23,42,0.88);

.area-popup.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}

/* =========================================================
PERSON MARKER
========================================================= */

.person-marker{

  width:42px;
  height:42px;

  display:flex;

}

}

WATERMARK

  position:fixed;

  z-index:9998;

    rgba(255,255,255,0.08);

  border-radius:16px;

  display:flex;
  align-items:center;

}

}

POLYGON LABEL

.polygon-label{

    rgba(27,67,50,0.92);

/* =========================================================
SEARCH HIGHLIGHT
========================================================= */

.search-highlight{

  animation:pulseHighlight 1.5s infinite;

}

@keyframes pulseHighlight{

  0%{
    filter:drop-shadow(0 0 0px #fff);
  }

  50%{
    filter:drop-shadow(0 0 12px #fff);
  }

  100%{
    filter:drop-shadow(0 0 0px #fff);
  }

}

.leaflet-control-zoom{
  display:none !important;
}

</style>
</head>

<body>

<!-- =========================================================
SPLASH
========================================================= -->

<div id="splashScreen">

  <div class="logo-top">

    <img
      src="icon-klepon-go-6171.png"
    >

  </div>

  <h1>KLEPON-GO</h1>

  <p>
    Viewer Wilkerstat Kota Pontianak
  </p>

  <div class="loading-container">

    <div class="loading-bar-bg">

      <div
        class="loading-bar"
        id="loadingBar"
      ></div>

    </div>

    <div
      class="loading-percent"
      id="loadingPercent"
    >
      0%
    </div>

  </div>

  <div class="logo-bottom">

    <img
      src="logo-bps-kota-pontianak-biru.png"
    >

  </div>

</div>

<!-- =========================================================
MAP
========================================================= -->

<div id="map"></div>

<!-- =========================================================
WATERMARK
========================================================= -->

<div class="map-watermark">

  <img
    src="logo-bps-kota-pontianak-biru.png"
  >

</div>

<!-- =========================================================
AREA POPUP
========================================================= -->

<div
  class="area-popup"
  id="areaPopup"
>

  <div>
    Kamu Memasuki
  </div>

  <h2 id="areaPopupTitle">
    SLS XXXXX
  </h2>

  <p id="areaPopupDesc">
    Pontianak Selatan
  </p>

</div>

<!-- =========================================================
TOP UI
========================================================= -->

<div class="top-ui">

  <div class="filter-card">

    <div class="search-box">

      <select
        id="searchType"
        class="search-type"
      >

        <option value="idsls">
          IDSLS
        </option>

        <option value="ppl">
          PPL
        </option>

        <option value="pml">
          PML
        </option>

      </select>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari IDSLS / Nama Petugas..."
      >

      <button
        class="search-btn"
        onclick="searchPolygon()"
      >

        <i class="fa-solid fa-magnifying-glass"></i>

      </button>

    </div>

    <div class="filter-group">

      <select
        id="kecamatanFilter"
        class="filter-select"
      >

        <option value="">
          Semua Kecamatan
        </option>

      </select>

      <select
        id="kelurahanFilter"
        class="filter-select"
      >

        <option value="">
          Semua Kelurahan
        </option>

      </select>

    </div>

  </div>

</div>

<!-- =========================================================
FLOAT BUTTONS
========================================================= -->

<div class="floating-buttons">

  <button
    class="float-btn"
    onclick="recenterUser()"
  >

    <i class="fa-solid fa-location-crosshairs"></i>

  </button>

  <button
    class="float-btn"
    onclick="resetFilters()"
  >

    <i class="fa-solid fa-rotate-right"></i>

  </button>

</div>

<!-- =========================================================
BOTTOM SHEET
========================================================= -->

<div class="bottom-sheet">

  <div
    class="sheet-title"
    id="sheetTitle"
  >
    Belum ada wilayah dipilih
  </div>

  <div class="info-grid">

    <div class="info-card">

      <div class="info-label">
        IDSLS
      </div>

      <div
        class="info-value"
        id="idsls"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        Kecamatan
      </div>

      <div
        class="info-value"
        id="kecamatan"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        Kelurahan
      </div>

      <div
        class="info-value"
        id="kelurahan"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        PPL
      </div>

      <div
        class="info-value"
        id="ppl"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">

        class="info-value"

        -
      </div>

  </div>

</div>

<script>

/* =========================================================
MAP
========================================================= */

const map = L.map('map',{
  zoomControl:false
})
.setView([-0.0263,109.3425],12);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

/* =========================================================
VARIABLES
========================================================= */

let allData;
let geojsonLayer;

let userMarker = null;

let currentUserLat = null;
let currentUserLng = null;

let currentArea = null;

const palette = [

  "#ff6b6b",
  "#4ecdc4",
  "#ffe66d",
  "#5dade2",
  "#a569bd",
  "#58d68d",
  "#f5b041",
  "#ec7063"

];

/* =========================================================
PERSON ICON
========================================================= */

const personIcon = L.divIcon({

  className:'',

  html:`

    <div
      class="person-marker"
      id="personMarker"
    >
      <i class="fa-solid fa-person"></i>
    </div>

  `,

  iconSize:[42,42],
  iconAnchor:[21,21]

});

/* =========================================================
LOADING BAR
========================================================= */

let progress = 0;

const loadingInterval = setInterval(()=>{

  progress += 10;

  if(progress > 100){
    progress = 100;
  }

  document
    .getElementById(
      'loadingBar'
    )
    .style.width = progress + '%';

  document
    .getElementById(
      'loadingPercent'
    )
    .innerText = progress + '%';

  if(progress >= 100){

    clearInterval(
      loadingInterval
    );

  }

},150);

/* =========================================================
LOAD GEOJSON
========================================================= */

fetch(
  'final_subsls_6171_2025-1_se2026.geojson'
)

.then(res => res.json())

.then(data => {

  allData = data;

  populateKecamatan();

  renderGeoJSON(
    allData.features
  );

  initializeGPS();

  setTimeout(()=>{

    document
      .getElementById(
        'splashScreen'
      )
      .style.display = 'none';

  },1000);

});

/* =========================================================
RENDER
========================================================= */

function renderGeoJSON(features){

  if(geojsonLayer){

    map.removeLayer(
      geojsonLayer
    );

  }

  geojsonLayer = L.geoJSON(features,{

    style:feature => ({

      color:'#ffffff',

      weight:1,

      fillOpacity:0.55,

      fillColor:
        palette[
          Math.floor(
            Math.random() *
            palette.length
          )
        ]

    }),

    onEachFeature:(feature,layer)=>{

      layer.on('click',()=>{

        selectPolygon(
          feature,
          layer
        );

      });

    }

  }).addTo(map);

}

/* =========================================================
SELECT POLYGON
========================================================= */

function selectPolygon(feature,layer){

  const props =
    feature.properties;

  document
    .getElementById(
      'sheetTitle'
    )
    .innerText =
      props.nmsls || '-';

  document
    .getElementById(
      'idsls'
    )
    .innerText =
      props.idsls || '-';

  document
    .getElementById(
      'kecamatan'
    )
    .innerText =
      props.nmkec || '-';

  document
    .getElementById(
      'kelurahan'
    )
    .innerText =
      props.nmdesa || '-';

  document
    .getElementById(
      'ppl'
    )
    .innerText =

      props.namapencacah_se2026 || '-';

  document
    .getElementById(
      'pml'
    )
    .innerText =

      props.namapengawas_se2026 || '-';

}

/* =========================================================
SEARCH
========================================================= */

function searchPolygon(){

  const keyword =
    document
    .getElementById(
      'searchInput'
    )
    .value
    .trim()
    .toLowerCase();

  const type =
    document
    .getElementById(
      'searchType'
    )
    .value;

  if(!keyword)return;

  const matchedLayers = [];

  geojsonLayer.eachLayer(layer => {

    const props =
      layer.feature.properties;

    let match = false;

    if(type === 'idsls'){

      match =

        String(props.idsls)
        .includes(keyword);

    }

    if(type === 'ppl'){

      match =

        String(
          props.namapencacah_se2026
        )
        .toLowerCase()
        .includes(keyword);

    }

    if(type === 'pml'){

      match =

        String(
          props.namapengawas_se2026
        )
        .toLowerCase()
        .includes(keyword);

    }

    if(match){

      matchedLayers.push(layer);

      layer.setStyle({

        color:'#ffffff',

        weight:4,

        fillOpacity:0.95

      });

      if(layer._path){

        layer._path.classList
        .add('search-highlight');

      }

    }

    else{

      layer.setStyle({

        fillOpacity:0.08,

        opacity:0.2

      });

      if(layer._path){

        layer._path.classList
        .remove('search-highlight');

      }

    }

  });

  if(matchedLayers.length){

    const group =
      L.featureGroup(
        matchedLayers
      );

    map.fitBounds(
      group.getBounds(),
      {
        padding:[40,40]
      }
    );

  }

}

/* =========================================================
GPS
========================================================= */

function initializeGPS(){

  navigator.geolocation.watchPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      currentUserLat = lat;
      currentUserLng = lng;

      if(!userMarker){

        userMarker =
          L.marker(

            [lat,lng],

            {
              icon:personIcon
            }

          ).addTo(map);

      }

      else{

        userMarker.setLatLng(
          [lat,lng]
        );

      }

      detectCurrentPolygon(
        lat,
        lng
      );

    },

    err => {

      console.log(err);

    },

    {

      enableHighAccuracy:true

    }

  );

}

/* =========================================================
RECENTER USER
========================================================= */

function recenterUser(){

  if(
    currentUserLat &&
    currentUserLng
  ){

    map.flyTo(

      [
        currentUserLat,
        currentUserLng
      ],

      17,

      {
        duration:1.5
      }

    );

  }

}

/* =========================================================
DETECT CURRENT POLYGON
========================================================= */

function detectCurrentPolygon(lat,lng){

  const point =
    turf.point([lng,lat]);

  for(const feature of allData.features){

    const inside =
      turf.booleanPointInPolygon(
        point,
        feature
      );

    if(inside){

      const props =
        feature.properties;

      const areaName =
        props.nmsls || '-';

      if(currentArea !== areaName){

        currentArea =
          areaName;

        showAreaPopup(

          props.nmsls || '-',

          props.namapencacah_se2026 || '-'

        );

      }

      return;

    }

  }

}

/* =========================================================
AREA POPUP
========================================================= */

function showAreaPopup(title,desc){

  const popup =
    document
    .getElementById(
      'areaPopup'
    );

  document
    .getElementById(
      'areaPopupTitle'
    )
    .innerText = title;

  document
    .getElementById(
      'areaPopupDesc'
    )
    .innerText =

      'PPL : ' + desc;

  popup.classList.add(
    'show'
  );

  setTimeout(()=>{

    popup.classList.remove(
      'show'
    );

  },3000);

}

/* =========================================================
FILTER KECAMATAN
========================================================= */

function populateKecamatan(){

  const unique =
    [...new Set(

      allData.features.map(f =>

        f.properties.nmkec

      )

    )];

  const select =
    document
    .getElementById(
      'kecamatanFilter'
    );

  unique.forEach(item => {

    const option =
      document.createElement(
        'option'
      );

    option.value = item;
    option.textContent = item;

    select.appendChild(
      option
    );

  });

}

/* =========================================================
FILTER CHANGE
========================================================= */

document
.getElementById(
  'kecamatanFilter'
)
.addEventListener(
  'change',
  function(){

    const kecamatan =
      this.value;

    if(!kecamatan){

      renderGeoJSON(
        allData.features
      );

      return;

    }

    const filtered =
      allData.features.filter(f =>

        f.properties.nmkec === kecamatan

      );

    renderGeoJSON(filtered);

  }
);

/* =========================================================
RESET
========================================================= */

function resetFilters(){

  document
    .getElementById(
      'searchInput'
    )
    .value = '';

  document
    .getElementById(
      'kecamatanFilter'
    )
    .value = '';

  renderGeoJSON(
    allData.features
  );

  map.setView(
    [-0.0263,109.3425],
    12
  );

}

</script>

</body>
</html>
