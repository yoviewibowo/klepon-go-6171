<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8"/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>KLEPON-GO</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>

/* =========================
RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

:root{

  --dark:#1B4332;
  --green:#2D6A4F;
  --light:#52B788;

  --soft:#D8F3DC;
  --muted:#B7D5C4;

}

body{
  overflow:hidden;
  background:var(--dark);
  color:white;
}

/* =========================
MAP
========================= */

#map{
  width:100vw;
  height:100vh;
}

/* =========================
SPLASH
========================= */

#splashScreen{

  position:fixed;
  inset:0;

  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    linear-gradient(
      135deg,
      #1B4332,
      #2D6A4F,
      #081C15
    );

}

.splash-glow{

  position:absolute;

  width:420px;
  height:420px;

  border-radius:50%;

  background:#95D5B244;

  filter:blur(120px);

  animation:pulse 4s infinite;

}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.2);
  }

  100%{
    transform:scale(1);
  }

}

.logo-top{

  width:110px;
  height:110px;

  border-radius:28px;

  background:
    rgba(255,255,255,0.08);

  border:
    2px dashed rgba(255,255,255,0.2);

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:24px;

}

.logo-top img{
  width:70%;
}

.app-title{

  font-size:34px;
  font-weight:900;

  letter-spacing:2px;

}

.app-subtitle{

  margin-top:8px;

  color:#E9F5EC;

  font-size:14px;

}

.loading-container{

  width:260px;

  margin-top:40px;

}

.loading-bar-bg{

  width:100%;
  height:14px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.08);

  overflow:hidden;

}

.loading-bar{

  width:0%;
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #4ecdc4,
      #5dade2,
      #a569bd
    );

  transition:width .4s ease;

}

.loading-text{

  margin-top:12px;

  text-align:center;

  font-size:13px;

  color:#E9F5EC;

}

.loading-percent{

  margin-top:8px;

  text-align:center;

  font-size:18px;
  font-weight:800;

}

/* =========================
TOP UI
========================= */

.top-ui{

  position:fixed;

  top:14px;
  left:14px;
  right:14px;

  z-index:9999;

}

.filter-card{

  background:
    rgba(27,67,50,0.92);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:14px;

  border:
    1px solid rgba(255,255,255,0.06);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.35);

}

/* =========================
SEARCH
========================= */

.search-box{

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 12px;

  border-radius:20px;

  background:
    rgba(255,255,255,0.06);

  margin-bottom:12px;

}

.search-box input{

  flex:1;

  background:none;
  border:none;
  outline:none;

  color:white;

  font-size:14px;

}

.search-box input::placeholder{
  color:#B7D5C4;
}

.search-btn{

  width:42px;
  height:42px;

  border:none;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #52B788,
      #40916C
    );

  color:white;

  font-size:14px;

}

/* =========================
FILTER
========================= */

.filter-group{

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;

}

.filter-select{

  width:100%;

  border:none;
  outline:none;

  padding:14px;

  border-radius:18px;

  background:
    rgba(255,255,255,0.06);

  color:white;

  font-size:13px;

}

.filter-select option{
  color:black;
}

/* =========================
FLOAT BUTTON
========================= */

.floating-buttons{

  position:fixed;

  right:16px;
  top:50%;

  transform:translateY(-50%);

  z-index:9999;

  display:flex;
  flex-direction:column;

  gap:12px;

}

.float-btn{

  width:58px;
  height:58px;

  border:none;

  border-radius:20px;

  background:
    rgba(45,106,79,0.95);

  color:white;

  font-size:18px;

}

/* =========================
LEGEND
========================= */

.legend{

  position:fixed;

  left:14px;
  bottom:150px;

  z-index:9999;

  max-width:170px;

  padding:12px;

  border-radius:20px;

  background:
    rgba(27,67,50,0.88);

  backdrop-filter:blur(14px);

}

.legend-title{

  font-size:12px;
  font-weight:700;

  margin-bottom:10px;

}

.legend-item{

  display:flex;
  align-items:center;

  gap:8px;

  margin-bottom:6px;

  font-size:11px;

}

.legend-color{

  width:12px;
  height:12px;

  border-radius:4px;

}

/* =========================
BOTTOM SHEET
========================= */

.bottom-sheet{

  position:fixed;

  left:12px;
  right:12px;
  bottom:12px;

  z-index:9999;

  background:
    rgba(27,67,50,0.95);

  backdrop-filter:blur(18px);

  border-radius:24px;

  padding:14px;

}

.bottom-sheet-header{

  display:flex;
  align-items:center;
  justify-content:space-between;

}

.sheet-title{

  font-size:16px;
  font-weight:800;

}

.toggle-sheet{

  width:34px;
  height:34px;

  border:none;

  border-radius:12px;

  background:
    rgba(255,255,255,0.08);

  color:white;

}

.sheet-content{

  margin-top:12px;

  overflow:hidden;

  max-height:400px;

  transition:.3s ease;

}

.sheet-content.hide{

  max-height:0;
  margin-top:0;

}

.info-grid{

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;

}

.info-card{

  padding:12px;

  border-radius:16px;

  background:
    rgba(255,255,255,0.06);

}

.info-label{

  font-size:10px;

  color:#B7D5C4;

  margin-bottom:4px;

}

.info-value{

  font-size:13px;
  font-weight:700;

}

.direction-btn{

  margin-top:12px;

  width:100%;

  border:none;

  padding:14px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #52B788,
      #40916C
    );

  color:white;

  font-size:14px;
  font-weight:800;

}

.creator-card{

  margin-top:10px;

  text-align:center;

  font-size:11px;

  color:#B7D5C4;

}

/* =========================
POLYGON LABEL
========================= */

.polygon-label{

  background:
    rgba(27,67,50,0.92);

  border:none;

  color:white;

  font-size:10px;
  font-weight:700;

  padding:4px 8px;

  border-radius:8px;

}

/* =========================
SEARCH HIGHLIGHT
========================= */

.search-highlight{

  animation:pulseHighlight 1.5s infinite;

}

@keyframes pulseHighlight{

  0%{
    filter:drop-shadow(0 0 0px #fff);
  }

  50%{
    filter:drop-shadow(0 0 12px #fff);
  }

  100%{
    filter:drop-shadow(0 0 0px #fff);
  }

}

/* =========================
AREA POPUP
========================= */

.area-popup{

  position:fixed;

  top:90px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-20px);

  z-index:999999;

  min-width:240px;

  padding:18px 26px;

  border-radius:24px;

  background:
    rgba(15,23,42,0.88);

  backdrop-filter:blur(18px);

  text-align:center;

  opacity:0;
  pointer-events:none;

  transition:.5s ease;

}

.area-popup.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}

.area-popup-sub{

  font-size:11px;

  color:#B7D5C4;

  margin-bottom:6px;

  letter-spacing:2px;

  text-transform:uppercase;

}

.area-popup-title{

  font-size:20px;
  font-weight:900;

  margin-bottom:6px;

}

.area-popup-desc{

  font-size:13px;

  color:#D8F3DC;

}

/* =========================
PERSON MARKER
========================= */

.person-marker{

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.person-marker i{

  font-size:30px;

  color:#4ecdc4;

  text-shadow:
    0 0 12px rgba(255,255,255,0.8);

}

.leaflet-control-zoom{
  display:none !important;
}

</style>
</head>

<body>

<!-- SPLASH -->

<div id="splashScreen">

  <div class="splash-glow"></div>

  <div class="logo-top">
    <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png">
  </div>

  <div class="app-title">
    KLEPON-GO
  </div>

  <div class="app-subtitle">
    Viewer Wilkerstat Kota Pontianak
  </div>

  <div class="loading-container">

    <div class="loading-bar-bg">
      <div
        class="loading-bar"
        id="loadingBar"
      ></div>
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      Initialize map...
    </div>

    <div
      class="loading-percent"
      id="loadingPercent"
    >
      0%
    </div>

  </div>

</div>

<div id="map"></div>

<!-- AREA POPUP -->

<div
  id="areaPopup"
  class="area-popup"
>
  <div class="area-popup-sub">
    Kamu Memasuki
  </div>

  <div
    class="area-popup-title"
    id="areaPopupTitle"
  >
    SLS XXXXX
  </div>

  <div
    class="area-popup-desc"
    id="areaPopupDesc"
  >
    Pontianak Selatan
  </div>
</div>

<!-- TOP UI -->

<div class="top-ui">

  <div class="filter-card">

    <div class="search-box">

      <i class="fa-solid fa-hashtag"></i>

      <input
        type="number"
        id="searchInput"
        placeholder="Masukkan IDSLS / IDSUBSLS..."
      >

      <button
        class="search-btn"
        onclick="searchPolygon()"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

    </div>

    <div class="filter-group">

      <select
        class="filter-select"
        id="kecamatanFilter"
      >
        <option value="">
          Semua Kecamatan
        </option>
      </select>

      <select
        class="filter-select"
        id="kelurahanFilter"
      >
        <option value="">
          Semua Kelurahan
        </option>
      </select>

    </div>

  </div>

</div>

<!-- FLOAT -->

<div class="floating-buttons">

  <button
    class="float-btn"
    onclick="locateUser()"
  >
    <i class="fa-solid fa-location-crosshairs"></i>
  </button>

  <button
    class="float-btn"
    onclick="resetFilters()"
  >
    <i class="fa-solid fa-rotate-right"></i>
  </button>

</div>

<!-- LEGEND -->

<div class="legend">

  <div
    class="legend-title"
    id="legendTitle"
  >
    Warna Kecamatan
  </div>

  <div id="legendItems"></div>

</div>

<!-- BOTTOM -->

<div class="bottom-sheet">

  <div class="bottom-sheet-header">

    <div
      class="sheet-title"
      id="sheetTitle"
    >
      Belum ada wilayah dipilih
    </div>

    <button
      class="toggle-sheet"
      onclick="toggleSheet()"
    >
      <i
        class="fa-solid fa-chevron-up"
        id="toggleIcon"
      ></i>
    </button>

  </div>

  <div
    class="sheet-content"
    id="sheetContent"
  >

    <div class="info-grid">

      <div class="info-card">

        <div class="info-label">
          IDSLS
        </div>

        <div
          class="info-value"
          id="idsls"
        >
          -
        </div>

      </div>

      <div class="info-card">

        <div class="info-label">
          IDSUBSLS
        </div>

        <div
          class="info-value"
          id="idsubsls"
        >
          -
        </div>

      </div>

      <div class="info-card">

        <div class="info-label">
          Kecamatan
        </div>

        <div
          class="info-value"
          id="kecamatan"
        >
          -
        </div>

      </div>

      <div class="info-card">

        <div class="info-label">
          Kelurahan
        </div>

        <div
          class="info-value"
          id="kelurahan"
        >
          -
        </div>

      </div>

    </div>

    <button
      class="direction-btn"
      onclick="navigateToPolygon()"
    >
      <i class="fa-solid fa-route"></i>
      Arahkan Saya
    </button>

    <div class="creator-card">
      KLEPON-GO by yovie.wibowo
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
MAP
========================= */

const map = L.map('map',{
  zoomControl:false
})
.setView([-0.0263,109.3425],12);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

/* =========================
VARIABLES
========================= */

let allData;
let geojsonLayer;
let selectedCenter = null;

let watchId = null;
let userMarker = null;
let currentHeading = 0;
let currentArea = null;

const palette = [

  "#ff6b6b",
  "#4ecdc4",
  "#ffe66d",
  "#5dade2",
  "#a569bd",
  "#58d68d",
  "#f5b041",
  "#ec7063",
  "#48c9b0",
  "#af7ac5"

];

const kecamatanColorMap = {};
const kelurahanColorMap = {};

/* =========================
PERSON ICON
========================= */

const personIcon = L.divIcon({

  className:"",

  html:`

    <div
      class="person-marker"
      id="personMarker"
    >
      <i class="fa-solid fa-person"></i>
    </div>

  `,

  iconSize:[42,42],
  iconAnchor:[21,21]

});

/* =========================
SPLASH
========================= */

let progress = 0;

const splashInterval = setInterval(() => {

  progress += 15;

  if(progress > 100){
    progress = 100;
  }

  document
    .getElementById("loadingBar")
    .style.width = progress + "%";

  document
    .getElementById("loadingPercent")
    .innerText = progress + "%";

  if(progress >= 100){

    clearInterval(splashInterval);

    setTimeout(() => {

      document
        .getElementById("splashScreen")
        .style.display = "none";

    },600);

  }

},400);

/* =========================
LOAD GEOJSON
========================= */

fetch('final_subsls_6171_2025-1.geojson')

.then(res => res.json())

.then(data => {

  allData = data;

  populateKecamatan();

  renderGeoJSON(
    allData.features
  );

});

/* =========================
COLOR
========================= */

function getColor(mapObj,key){

  if(!mapObj[key]){

    const index =
      Object.keys(mapObj).length
      % palette.length;

    mapObj[key] =
      palette[index];

  }

  return mapObj[key];

}

/* =========================
RENDER
========================= */

function renderGeoJSON(features){

  if(geojsonLayer){

    map.removeLayer(geojsonLayer);

  }

  const selectedKec =
    document
    .getElementById("kecamatanFilter")
    .value;

  const selectedKel =
    document
    .getElementById("kelurahanFilter")
    .value;

  geojsonLayer = L.geoJSON(features,{

    style:feature => {

      const props =
        feature.properties;

      let fill;

      if(!selectedKec){

        fill =
          getColor(
            kecamatanColorMap,
            props.nmkec
          );

      }

      else{

        fill =
          getColor(
            kelurahanColorMap,
            props.nmdesa
          );

      }

      return{

        color:"#ffffff",

        weight:1,

        fillColor:fill,

        fillOpacity:0.55

      };

    },

    onEachFeature:(feature,layer)=>{

      layer.on('click',()=>{

        selectPolygon(
          feature,
          layer
        );

      });

      if(selectedKel){

        layer.bindTooltip(

          feature.properties.nmsls || "-",

          {
            permanent:true,
            direction:"center",
            className:"polygon-label"
          }

        );

      }

    }

  }).addTo(map);

  updateLegend(features);

}

/* =========================
SELECT POLYGON
========================= */

function selectPolygon(feature,layer){

  const props =
    feature.properties;

  document
    .getElementById("sheetTitle")
    .innerText =
      props.nmsls || "-";

  document
    .getElementById("idsls")
    .innerText =
      props.idsls || "-";

  document
    .getElementById("idsubsls")
    .innerText =
      props.idsubsls || "-";

  document
    .getElementById("kecamatan")
    .innerText =
      props.nmkec || "-";

  document
    .getElementById("kelurahan")
    .innerText =
      props.nmdesa || "-";

  selectedCenter =
    layer.getBounds().getCenter();

}

/* =========================
SEARCH
========================= */

function searchPolygon(){

  const keyword =
    document
    .getElementById("searchInput")
    .value
    .trim();

  if(!keyword){

    alert(
      "Masukkan IDSLS atau IDSUBSLS"
    );

    return;

  }

  let found = false;

  geojsonLayer.eachLayer(layer => {

    const props =
      layer.feature.properties;

    const idsls =
      String(props.idsls || "");

    const idsubsls =
      String(props.idsubsls || "");

    layer.setStyle({

      weight:1,
      opacity:1,
      fillOpacity:0.18

    });

    if(layer._path){

      layer._path.classList
      .remove("search-highlight");

    }

    if(

      idsls === keyword ||
      idsubsls === keyword

    ){

      found = true;

      layer.setStyle({

        color:"#ffffff",

        weight:4,

        fillOpacity:0.95,

        opacity:1

      });

      layer.bringToFront();

      if(layer._path){

        layer._path.classList
        .add("search-highlight");

      }

      selectPolygon(
        layer.feature,
        layer
      );

      map.fitBounds(
        layer.getBounds(),
        {
          padding:[40,40]
        }
      );

    }

    else{

      layer.setStyle({

        fillOpacity:0.08,

        opacity:0.25

      });

    }

  });

  if(!found){

    alert(
      "Polygon tidak ditemukan"
    );

  }

}

/* =========================
SORT KECAMATAN
========================= */

function populateKecamatan(){

  const temp = [];

  allData.features.forEach(f => {

    temp.push({

      kode:f.properties.kdkec,

      nama:f.properties.nmkec

    });

  });

  const unique =
    [...new Map(
      temp.map(item => [
        item.kode,
        item
      ])
    ).values()];

  unique.sort((a,b)=>

    a.kode.localeCompare(b.kode)

  );

  const select =
    document
    .getElementById("kecamatanFilter");

  unique.forEach(item => {

    const option =
      document.createElement("option");

    option.value =
      item.nama;

    option.textContent =
      item.nama;

    select.appendChild(option);

  });

}

/* =========================
FILTER KEC
========================= */

document
.getElementById("kecamatanFilter")
.addEventListener("change",function(){

  const kecamatan =
    this.value;

  Object.keys(kelurahanColorMap)
  .forEach(key => {

    delete kelurahanColorMap[key];

  });

  const kelSelect =
    document
    .getElementById("kelurahanFilter");

  kelSelect.innerHTML = `
    <option value="">
      Semua Kelurahan
    </option>
  `;

  if(!kecamatan){

    renderGeoJSON(
      allData.features
    );

    map.setView(
      [-0.0263,109.3425],
      12
    );

    return;

  }

  const filtered =
    allData.features.filter(f =>

      f.properties.nmkec === kecamatan

    );

  renderGeoJSON(filtered);

  const temp =
    [];

  filtered.forEach(f => {

    temp.push({

      kode:f.properties.kddesa,

      nama:f.properties.nmdesa

    });

  });

  const unique =
    [...new Map(
      temp.map(item => [
        item.kode,
        item
      ])
    ).values()];

  unique.sort((a,b)=>

    a.kode.localeCompare(b.kode)

  );

  unique.forEach(item => {

    const option =
      document.createElement("option");

    option.value =
      item.nama;

    option.textContent =
      item.nama;

    kelSelect.appendChild(option);

  });

});

/* =========================
FILTER KEL
========================= */

document
.getElementById("kelurahanFilter")
.addEventListener("change",function(){

  const kecamatan =
    document
    .getElementById("kecamatanFilter")
    .value;

  const kelurahan =
    this.value;

  if(!kelurahan){

    const filtered =
      allData.features.filter(f =>

        f.properties.nmkec === kecamatan

      );

    renderGeoJSON(filtered);

    return;

  }

  const filtered =
    allData.features.filter(f =>

      f.properties.nmkec === kecamatan &&
      f.properties.nmdesa === kelurahan

    );

  renderGeoJSON(filtered);

});

/* =========================
LIVE GPS
========================= */

function locateUser(){

  if(watchId){

    navigator.geolocation
    .clearWatch(watchId);

    watchId = null;

    if(userMarker){

      map.removeLayer(userMarker);

      userMarker = null;

    }

    return;

  }

  watchId =
    navigator.geolocation.watchPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        const heading =
          position.coords.heading;

        if(heading !== null){

          currentHeading =
            heading;

        }

        if(!userMarker){

          userMarker =
            L.marker(

              [lat,lng],

              {
                icon:personIcon
              }

            ).addTo(map);

        }

        else{

          userMarker.setLatLng(
            [lat,lng]
          );

        }

        setTimeout(() => {

          const markerEl =
            document.getElementById(
              "personMarker"
            );

          if(markerEl){

            markerEl.style.transform =
              `rotate(${currentHeading}deg)`;

          }

        },50);

        map.setView(
          [lat,lng],
          17
        );

        detectCurrentPolygon(
          lat,
          lng
        );

      }

    );

}

/* =========================
DETECT POLYGON
========================= */

function detectCurrentPolygon(lat,lng){

  const point =
    turf.point([lng,lat]);

  for(const feature of allData.features){

    const inside =
      turf.booleanPointInPolygon(
        point,
        feature
      );

    if(inside){

      const props =
        feature.properties;

      const areaName =
        props.nmsls || "-";

      if(currentArea !== areaName){

        currentArea =
          areaName;

        showAreaPopup(

          props.nmsls || "-",

          props.nmdesa || "-"

        );

      }

      return;

    }

  }

}

/* =========================
SHOW AREA POPUP
========================= */

function showAreaPopup(title,desc){

  const popup =
    document.getElementById(
      "areaPopup"
    );

  document
    .getElementById(
      "areaPopupTitle"
    )
    .innerText = title;

  document
    .getElementById(
      "areaPopupDesc"
    )
    .innerText = desc;

  popup.classList.add("show");

  setTimeout(() => {

    popup.classList.remove("show");

  },3000);

}

/* =========================
LEGEND
========================= */

function updateLegend(features){

  const selectedKec =
    document
    .getElementById("kecamatanFilter")
    .value;

  const legend =
    document
    .getElementById("legendItems");

  legend.innerHTML = "";

  const unique = {};

  features.forEach(f => {

    const props =
      f.properties;

    let key;
    let color;

    if(!selectedKec){

      key = props.nmkec;

      color =
        getColor(
          kecamatanColorMap,
          props.nmkec
        );

    }

    else{

      key = props.nmdesa;

      color =
        getColor(
          kelurahanColorMap,
          props.nmdesa
        );

    }

    unique[key] = color;

  });

  Object.entries(unique)
  .forEach(([name,color]) => {

    const div =
      document.createElement("div");

    div.className =
      "legend-item";

    div.innerHTML = `

      <div
        class="legend-color"
        style="background:${color}"
      ></div>

      <span>${name}</span>

    `;

    legend.appendChild(div);

  });

}

/* =========================
RESET
========================= */

function resetFilters(){

  document
    .getElementById("kecamatanFilter")
    .value = "";

  document
    .getElementById("kelurahanFilter")
    .innerHTML = `
      <option value="">
        Semua Kelurahan
      </option>
    `;

  document
    .getElementById("searchInput")
    .value = "";

  renderGeoJSON(
    allData.features
  );

  map.setView(
    [-0.0263,109.3425],
    12
  );

}

/* =========================
NAVIGATE
========================= */

function navigateToPolygon(){

  if(!selectedCenter){

    alert(
      "Pilih polygon terlebih dahulu"
    );

    return;

  }

  const lat =
    selectedCenter.lat;

  const lng =
    selectedCenter.lng;

  window.open(

    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,

    "_blank"

  );

}

/* =========================
TOGGLE SHEET
========================= */

function toggleSheet(){

  const content =
    document
    .getElementById("sheetContent");

  const icon =
    document
    .getElementById("toggleIcon");

  content.classList.toggle("hide");

  if(content.classList.contains("hide")){

    icon.className =
      "fa-solid fa-chevron-down";

  }

  else{

    icon.className =
      "fa-solid fa-chevron-up";

  }

}
