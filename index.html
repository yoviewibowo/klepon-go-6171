<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8"/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>KLEPON-GO</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>

/* =========================================================
RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  overflow:hidden;
  background:#1B4332;
  color:white;
}

#map{
  width:100vw;
  height:100vh;
}

/* =========================================================
SPLASH
========================================================= */

#splashScreen{

  position:fixed;
  inset:0;

  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    linear-gradient(
      135deg,
      #1B4332,
      #2D6A4F,
      #081C15
    );

}

.logo-top{

  width:220px;
  height:120px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:24px;

}

.logo-top img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.logo-bottom{

  position:absolute;

  bottom:40px;

  width:140px;
  height:70px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px;

  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(12px);

  border-radius:20px;

}

.logo-bottom img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.loading-container{

  width:260px;

  margin-top:34px;

}

.loading-bar-bg{

  width:100%;
  height:14px;

  border-radius:999px;

  overflow:hidden;

  background:
    rgba(255,255,255,0.08);

}

.loading-bar{

  width:0%;
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #4ecdc4,
      #5dade2,
      #a569bd
    );

  transition:.3s ease;

}

.loading-percent{

  margin-top:12px;

  text-align:center;

  font-size:18px;
  font-weight:800;

}

/* =========================================================
TOP UI
========================================================= */

.top-ui{

  position:fixed;

  top:14px;
  left:14px;
  right:14px;

  z-index:9999;

}

.filter-card{

  background:
    rgba(27,67,50,0.92);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:14px;

  border:
    1px solid rgba(255,255,255,0.06);

}

/* =========================================================
SEARCH
========================================================= */

.search-box{

  display:flex;
  gap:10px;

  margin-bottom:12px;

}

.search-box input{

  flex:1;

  border:none;
  outline:none;

  padding:14px;

  border-radius:16px;

  background:
    rgba(255,255,255,0.08);

  color:white;

}

.search-box input::placeholder{
  color:#B7D5C4;
}

.search-type{

  width:130px;

  border:none;
  outline:none;

  border-radius:16px;

  padding:14px;

  background:
    rgba(255,255,255,0.08);

  color:white;

}

.search-type option{
  color:black;
}

.search-btn{

  width:54px;

  border:none;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #52B788,
      #40916C
    );

  color:white;

}

/* =========================================================
FILTER
========================================================= */

.filter-group{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.filter-select{

  border:none;
  outline:none;

  padding:14px;

  border-radius:16px;

  background:
    rgba(255,255,255,0.08);

  color:white;

}

.filter-select option{
  color:black;
}

/* =========================================================
FLOAT BUTTONS
========================================================= */

.floating-buttons{

  position:fixed;

  right:16px;
  top:50%;

  transform:translateY(-50%);

  z-index:9999;

  display:flex;
  flex-direction:column;

  gap:12px;

}

.float-btn{

  width:58px;
  height:58px;

  border:none;

  border-radius:20px;

  background:
    rgba(45,106,79,0.95);

  color:white;

  font-size:18px;

}

/* =========================================================
BOTTOM SHEET
========================================================= */

.bottom-sheet{

  position:fixed;

  left:12px;
  right:12px;
  bottom:12px;

  z-index:9999;

  background:
    rgba(27,67,50,0.95);

  backdrop-filter:blur(18px);

  border-radius:24px;

  padding:14px;

}

.sheet-title{

  font-size:18px;
  font-weight:800;

  margin-bottom:12px;

}

.info-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.info-card{

  padding:12px;

  border-radius:16px;

  background:
    rgba(255,255,255,0.06);

}

.info-label{

  font-size:10px;

  color:#B7D5C4;

  margin-bottom:4px;

}

.info-value{

  font-size:13px;
  font-weight:700;

}

/* =========================================================
AREA POPUP
========================================================= */

.area-popup{

  position:fixed;

  top:90px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-20px);

  z-index:999999;

  min-width:240px;

  padding:18px 26px;

  border-radius:24px;

  background:
    rgba(15,23,42,0.88);

  backdrop-filter:blur(18px);

  text-align:center;

  opacity:0;

  transition:.5s ease;

}

.area-popup.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}

/* =========================================================
PERSON MARKER
========================================================= */

.person-marker{

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.person-marker i{

  font-size:30px;

  color:#4ecdc4;

}

/* =========================================================
WATERMARK
========================================================= */

.map-watermark{

  position:fixed;

  left:18px;
  bottom:18px;

  z-index:9998;

  width:54px;
  height:54px;

  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(12px);

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.map-watermark img{

  width:80%;
  height:80%;

  object-fit:contain;

}

/* =========================================================
POLYGON LABEL
========================================================= */

.polygon-label{

  background:
    rgba(27,67,50,0.92);

  border:none;

  color:white;

  font-size:10px;
  font-weight:700;

  padding:4px 8px;

  border-radius:8px;

  box-shadow:none;

}

/* =========================================================
SEARCH HIGHLIGHT
========================================================= */

.search-highlight{

  animation:pulseHighlight 1.5s infinite;

}

@keyframes pulseHighlight{

  0%{
    filter:drop-shadow(0 0 0px #fff);
  }

  50%{
    filter:drop-shadow(0 0 12px #fff);
  }

  100%{
    filter:drop-shadow(0 0 0px #fff);
  }

}

.leaflet-control-zoom{
  display:none !important;
}

</style>
</head>

<body>

<div id="splashScreen">

  <div class="logo-top">

    <img
      src="icon-klepon-go-6171.png"
    >

  </div>

  <h1>KLEPON-GO</h1>

  <p>
    Viewer Wilkerstat Kota Pontianak
  </p>

  <div class="loading-container">

    <div class="loading-bar-bg">

      <div
        class="loading-bar"
        id="loadingBar"
      ></div>

    </div>

    <div
      class="loading-percent"
      id="loadingPercent"
    >
      100%
    </div>

  </div>

  <div class="logo-bottom">

    <img
      src="logo-bps-kota-pontianak-biru.png"
    >

  </div>

</div>

<div id="map"></div>

<div class="map-watermark">

  <img
    src="logo-bps-kota-pontianak-biru.png"
  >

</div>

<div
  class="area-popup"
  id="areaPopup"
>

  <div>
    Kamu Memasuki
  </div>

  <h2 id="areaPopupTitle">
    SLS XXXXX
  </h2>

  <p id="areaPopupDesc">
    Pontianak Selatan
  </p>

</div>

<div class="top-ui">

  <div class="filter-card">

    <div class="search-box">

      <select
        id="searchType"
        class="search-type"
      >

        <option value="idsls">
          IDSLS
        </option>

        <option value="ppl">
          PPL
        </option>

        <option value="pml">
          PML
        </option>

      </select>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari IDSLS / Nama Petugas..."
      >

      <button
        class="search-btn"
        onclick="searchPolygon()"
      >

        <i class="fa-solid fa-magnifying-glass"></i>

      </button>

    </div>

    <div class="filter-group">

      <select
        id="kecamatanFilter"
        class="filter-select"
      >

        <option value="">
          Semua Kecamatan
        </option>

      </select>

      <select
        id="kelurahanFilter"
        class="filter-select"
      >

        <option value="">
          Semua Kelurahan
        </option>

      </select>

    </div>

  </div>

</div>

<div class="floating-buttons">

  <button
    class="float-btn"
    onclick="recenterUser()"
  >

    <i class="fa-solid fa-location-crosshairs"></i>

  </button>

  <button
    class="float-btn"
    onclick="resetFilters()"
  >

    <i class="fa-solid fa-rotate-right"></i>

  </button>

</div>

<div class="bottom-sheet">

  <div
    class="sheet-title"
    id="sheetTitle"
  >
    Belum ada wilayah dipilih
  </div>

  <div class="info-grid">

    <div class="info-card">

      <div class="info-label">
        IDSLS
      </div>

      <div
        class="info-value"
        id="idsls"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        Kecamatan
      </div>

      <div
        class="info-value"
        id="kecamatan"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        Kelurahan
      </div>

      <div
        class="info-value"
        id="kelurahan"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        PPL
      </div>

      <div
        class="info-value"
        id="ppl"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        PML
      </div>

      <div
        class="info-value"
        id="pml"
      >
        -
      </div>

    </div>

  </div>

</div>

<script>

const map = L.map('map',{
  zoomControl:false
})
.setView([-0.0263,109.3425],12);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

let allData;
let geojsonLayer;

let currentMode = "default";

let userMarker = null;

let currentUserLat = null;
let currentUserLng = null;

let currentArea = null;

const palette = [

  "#ff6b6b",
  "#4ecdc4",
  "#ffe66d",
  "#5dade2",
  "#a569bd",
  "#58d68d",
  "#f5b041",
  "#ec7063",
  "#48c9b0",
  "#af7ac5"

];

const kecamatanColors = {};
const kelurahanColors = {};
const pplColors = {};

function getColor(obj,key){

  if(!obj[key]){

    const index =
      Object.keys(obj).length %
      palette.length;

    obj[key] =
      palette[index];

  }

  return obj[key];

}

const personIcon = L.divIcon({

  className:'',

  html:`

    <div
      class="person-marker"
      id="personMarker"
    >
      <i class="fa-solid fa-person"></i>
    </div>

  `,

  iconSize:[42,42],
  iconAnchor:[21,21]

});

fetch(
  'final_subsls_6171_2025-1_se2026.geojson'
)

.then(res => res.json())

.then(data => {

  allData = data;

  populateKecamatan();

  renderGeoJSON(
    allData.features
  );

  initializeGPS();

  document
    .getElementById(
      'splashScreen'
    )
    .style.display = 'none';

});

function renderGeoJSON(features){

  if(geojsonLayer){

    map.removeLayer(
      geojsonLayer
    );

  }

  geojsonLayer = L.geoJSON(features,{

    style:feature => {

      const props =
        feature.properties;

      let fillColor =
        "#52B788";

      if(currentMode === "default"){

        fillColor =

          getColor(
            kecamatanColors,
            props.nmkec
          );

      }

      if(currentMode === "kecamatan"){

        fillColor =

          getColor(
            kelurahanColors,
            props.nmdesa
          );

      }

      if(currentMode === "kelurahan"){

        fillColor =
          "#52B788";

      }

      if(currentMode === "search_ppl"){

        fillColor =

          getColor(
            kecamatanColors,
            props.nmkec
          );

      }

      if(currentMode === "search_pml"){

        fillColor =

          getColor(
            pplColors,
            props.namapencacah_se2026
          );

      }

      return{

        color:"#111111",

        weight:1.5,

        fillColor:fillColor,

        fillOpacity:0.6

      };

    },

    onEachFeature:(feature,layer)=>{

      const props =
        feature.properties;

      if(

        currentMode === "kelurahan" ||

        currentMode === "search_ppl"

      ){

        layer.bindTooltip(

          props.nmsls || '-',

          {

            permanent:true,

            direction:'center',

            className:'polygon-label'

          }

        );

      }

      layer.on('click',()=>{

        selectPolygon(
          feature
        );

      });

    }

  }).addTo(map);

}

function selectPolygon(feature){

  const props =
    feature.properties;

  document
    .getElementById(
      'sheetTitle'
    )
    .innerText =
      props.nmsls || '-';

  document
    .getElementById(
      'idsls'
    )
    .innerText =
      props.idsls || '-';

  document
    .getElementById(
      'kecamatan'
    )
    .innerText =
      props.nmkec || '-';

  document
    .getElementById(
      'kelurahan'
    )
    .innerText =
      props.nmdesa || '-';

  document
    .getElementById(
      'ppl'
    )
    .innerText =
      props.namapencacah_se2026 || '-';

  document
    .getElementById(
      'pml'
    )
    .innerText =
      props.namapengawas_se2026 || '-';

}

function populateKecamatan(){

  const uniqueMap =
    new Map();

  allData.features.forEach(f => {

    const props =
      f.properties;

    uniqueMap.set(

      props.kdkec,

      {

        kode:props.kdkec,

        nama:props.nmkec

      }

    );

  });

  const sorted =
    [...uniqueMap.values()]
    .sort((a,b)=>

      a.kode.localeCompare(
        b.kode
      )

    );

  const select =
    document
    .getElementById(
      'kecamatanFilter'
    );

  sorted.forEach(item => {

    const option =
      document.createElement(
        'option'
      );

    option.value =
      item.nama;

    option.textContent =

      `[${item.kode}] ${item.nama}`;

    select.appendChild(
      option
    );

  });

}

function populateKelurahan(kecamatan){

  const kelSelect =
    document
    .getElementById(
      'kelurahanFilter'
    );

  kelSelect.innerHTML = `

    <option value="">
      Semua Kelurahan
    </option>

  `;

  const uniqueMap =
    new Map();

  allData.features
  .filter(f =>

    f.properties.nmkec === kecamatan

  )
  .forEach(f => {

    const props =
      f.properties;

    uniqueMap.set(

      props.kddesa,

      {

        kode:props.kddesa,

        nama:props.nmdesa

      }

    );

  });

  const sorted =
    [...uniqueMap.values()]
    .sort((a,b)=>

      a.kode.localeCompare(
        b.kode
      )

    );

  sorted.forEach(item => {

    const option =
      document.createElement(
        'option'
      );

    option.value =
      item.nama;

    option.textContent =

      `[${item.kode}] ${item.nama}`;

    kelSelect.appendChild(
      option
    );

  });

}

document
.getElementById(
  'kecamatanFilter'
)
.addEventListener(
  'change',
  function(){

    const kecamatan =
      this.value;

    if(!kecamatan){

      currentMode =
        "default";

      renderGeoJSON(
        allData.features
      );

      return;

    }

    currentMode =
      "kecamatan";

    populateKelurahan(
      kecamatan
    );

    const filtered =
      allData.features.filter(f =>

        f.properties.nmkec === kecamatan

      );

    renderGeoJSON(filtered);

  }
);

document
.getElementById(
  'kelurahanFilter'
)
.addEventListener(
  'change',
  function(){

    const kecamatan =
      document
      .getElementById(
        'kecamatanFilter'
      )
      .value;

    const kelurahan =
      this.value;

    if(!kelurahan){

      currentMode =
        "kecamatan";

      const filtered =
        allData.features.filter(f =>

          f.properties.nmkec === kecamatan

        );

      renderGeoJSON(filtered);

      return;

    }

    currentMode =
      "kelurahan";

    const filtered =
      allData.features.filter(f =>

        f.properties.nmkec === kecamatan &&
        f.properties.nmdesa === kelurahan

      );

    renderGeoJSON(filtered);

  }
);

function searchPolygon(){

  const keyword =
    document
    .getElementById(
      'searchInput'
    )
    .value
    .trim()
    .toLowerCase();

  const type =
    document
    .getElementById(
      'searchType'
    )
    .value;

  if(!keyword)return;

  let filtered = [];

  if(type === 'idsls'){

    currentMode =
      "default";

    filtered =
      allData.features.filter(f =>

        String(f.properties.idsls)
        .includes(keyword)

      );

  }

  if(type === 'ppl'){

    currentMode =
      "search_ppl";

    filtered =
      allData.features.filter(f =>

        String(
          f.properties.namapencacah_se2026
        )
        .toLowerCase()
        .includes(keyword)

      );

  }

  if(type === 'pml'){

    currentMode =
      "search_pml";

    filtered =
      allData.features.filter(f =>

        String(
          f.properties.namapengawas_se2026
        )
        .toLowerCase()
        .includes(keyword)

      );

  }

  renderGeoJSON(filtered);

  setTimeout(()=>{

    geojsonLayer.eachLayer(layer=>{

      if(layer._path){

        layer._path.classList
        .add('search-highlight');

      }

    });

  },200);

  if(filtered.length){

    const group =
      L.featureGroup(
        geojsonLayer.getLayers()
      );

    map.fitBounds(
      group.getBounds(),
      {
        padding:[40,40]
      }
    );

  }

}

function initializeGPS(){

  navigator.geolocation.watchPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      currentUserLat = lat;
      currentUserLng = lng;

      if(!userMarker){

        userMarker =
          L.marker(

            [lat,lng],

            {
              icon:personIcon
            }

          ).addTo(map);

      }

      else{

        userMarker.setLatLng(
          [lat,lng]
        );

      }

      detectCurrentPolygon(
        lat,
        lng
      );

    }

  );

}

function recenterUser(){

  if(
    currentUserLat &&
    currentUserLng
  ){

    map.flyTo(

      [
        currentUserLat,
        currentUserLng
      ],

      17,

      {
        duration:1.5
      }

    );

  }

}

function detectCurrentPolygon(lat,lng){

  const point =
    turf.point([lng,lat]);

  for(const feature of allData.features){

    const inside =
      turf.booleanPointInPolygon(
        point,
        feature
      );

    if(inside){

      const props =
        feature.properties;

      const areaName =
        props.nmsls || '-';

      if(currentArea !== areaName){

        currentArea =
          areaName;

        showAreaPopup(

          props.nmsls || '-',

          props.namapencacah_se2026 || '-'

        );

      }

      return;

    }

  }

}

function showAreaPopup(title,desc){

  const popup =
    document
    .getElementById(
      'areaPopup'
    );

  document
    .getElementById(
      'areaPopupTitle'
    )
    .innerText = title;

  document
    .getElementById(
      'areaPopupDesc'
    )
    .innerText =

      'PPL : ' + desc;

  popup.classList.add(
    'show'
  );

  setTimeout(()=>{

    popup.classList.remove(
      'show'
    );

  },3000);

}

function resetFilters(){

  currentMode =
    "default";

  document
    .getElementById(
      'searchInput'
    )
    .value = '';

  document
    .getElementById(
      'kecamatanFilter'
    )
    .value = '';

  document
    .getElementById(
      'kelurahanFilter'
    )
    .innerHTML = `

      <option value="">
        Semua Kelurahan
      </option>

    `;

  renderGeoJSON(
    allData.features
  );

  map.setView(
    [-0.0263,109.3425],
    12
  );

}

</script>

</body>
</html>
