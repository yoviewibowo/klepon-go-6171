<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>KLEPON-GO</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

:root{

  --pandan-dark:#1B4332;
  --pandan:#2D6A4F;
  --pandan-light:#52B788;

  --coconut:#F8F9FA;
  --coconut-soft:#E9F5EC;

  --gula:#9C6644;
  --gula-dark:#7F5539;

  --text-soft:#D8F3DC;
  --text-muted:#B7D5C4;

}

body{
  overflow:hidden;
  background:var(--pandan-dark);
  color:white;
}

/* =========================
   SPLASH SCREEN
========================= */

#splashScreen{

  position:fixed;
  inset:0;

  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    linear-gradient(
      135deg,
      var(--pandan-dark),
      var(--pandan),
      var(--gula-dark)
    );

}

.splash-glow{

  position:absolute;

  width:420px;
  height:420px;

  border-radius:50%;

  background:#95D5B244;

  filter:blur(120px);

  animation:pulse 4s infinite;

}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.2);
  }

  100%{
    transform:scale(1);
  }

}

.logo-top{

  width:110px;
  height:110px;

  border-radius:30px;

  background:
    rgba(255,255,255,0.08);

  border:
    2px dashed rgba(255,255,255,0.2);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:2;

  margin-bottom:24px;

  backdrop-filter:blur(10px);

}

.logo-top img{
  width:70%;
}

.app-title{

  font-size:34px;
  font-weight:900;

  letter-spacing:2px;

  z-index:2;

}

.app-subtitle{

  margin-top:8px;

  color:#E9F5EC;

  font-size:14px;

  z-index:2;

}

.loading-container{

  width:260px;

  margin-top:40px;

  z-index:2;

}

.loading-bar-bg{

  width:100%;
  height:14px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.08);

  overflow:hidden;

}

.loading-bar{

  width:0%;
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #95D5B2,
      #9C6644
    );

  transition:width .4s ease;

}

.loading-text{

  margin-top:12px;

  text-align:center;

  color:#E9F5EC;

  font-size:13px;

}

.loading-percent{

  margin-top:8px;

  text-align:center;

  font-size:18px;
  font-weight:800;

}

.logo-bottom{

  position:absolute;

  bottom:40px;

  width:85px;
  height:85px;

  border-radius:24px;

  background:
    rgba(255,255,255,0.08);

  border:
    2px dashed rgba(255,255,255,0.2);

  display:flex;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(10px);

}

/* =========================
   MAP
========================= */

#map{
  width:100vw;
  height:100vh;
}

/* =========================
   TOP UI
========================= */

.top-ui{

  position:fixed;

  top:14px;
  left:14px;
  right:14px;

  z-index:9999;

}

.filter-card{

  background:
    rgba(27,67,50,0.92);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:14px;

  border:
    1px solid rgba(255,255,255,0.06);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.35);

}

.search-box{

  display:flex;
  align-items:center;
  gap:12px;

  padding:16px;

  border-radius:20px;

  background:
    rgba(255,255,255,0.06);

  margin-bottom:12px;

}

.search-box i{

  color:#B7D5C4;

  font-size:15px;

}

.search-box input{

  width:100%;

  background:none;
  border:none;
  outline:none;

  color:white;

  font-size:14px;

}

.search-box input::placeholder{
  color:#B7D5C4;
}

.filter-group{

  display:flex;
  flex-direction:column;
  gap:10px;

}

.filter-select{

  width:100%;

  border:none;
  outline:none;

  padding:15px 16px;

  border-radius:18px;

  background:
    rgba(255,255,255,0.06);

  color:white;

  font-size:14px;

}

.filter-select option{
  color:black;
}

/* =========================
   FLOATING BUTTONS
========================= */

.floating-buttons{

  position:fixed;

  right:16px;
  top:50%;

  transform:translateY(-50%);

  z-index:9999;

  display:flex;
  flex-direction:column;
  gap:12px;

}

.float-btn{

  width:58px;
  height:58px;

  border:none;

  border-radius:20px;

  background:
    rgba(45,106,79,0.95);

  color:white;

  font-size:18px;

  backdrop-filter:blur(12px);

  border:
    1px solid rgba(255,255,255,0.06);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.25);

}

/* =========================
   LEGEND
========================= */

.legend{

  position:fixed;

  left:14px;
  bottom:330px;

  z-index:9999;

  max-width:170px;

  padding:14px;

  border-radius:22px;

  background:
    rgba(27,67,50,0.9);

  backdrop-filter:blur(14px);

  border:
    1px solid rgba(255,255,255,0.06);

}

.legend-title{

  font-size:13px;
  font-weight:700;

  margin-bottom:10px;

  color:#E9F5EC;

}

.legend-item{

  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:8px;

  font-size:12px;

  color:#D8F3DC;

}

.legend-color{

  width:12px;
  height:12px;

  border-radius:4px;

}

/* =========================
   BOTTOM SHEET
========================= */

.bottom-sheet{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:9999;

  background:
    rgba(27,67,50,0.96);

  backdrop-filter:blur(18px);

  border-radius:30px 30px 0 0;

  padding:18px;

  box-shadow:
    0 -10px 30px rgba(0,0,0,0.35);

}

.drag-line{

  width:60px;
  height:5px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.22);

  margin:0 auto 18px;

}

.badge{

  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:8px 14px;

  border-radius:999px;

  background:#52B78822;

  color:#D8F3DC;

  font-size:12px;

  margin-bottom:14px;

}

.sheet-title{

  font-size:22px;
  font-weight:800;

  margin-bottom:16px;

  color:#F8F9FA;

}

.info-grid{

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

}

.info-card{

  padding:14px;

  border-radius:18px;

  background:
    rgba(255,255,255,0.06);

  border:
    1px solid rgba(255,255,255,0.04);

}

.info-label{

  font-size:11px;

  color:#B7D5C4;

  margin-bottom:5px;

}

.info-value{

  font-size:14px;
  font-weight:700;

  color:white;

}

.direction-btn{

  margin-top:16px;

  width:100%;

  border:none;

  padding:16px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #52B788,
      #9C6644
    );

  color:white;

  font-size:15px;
  font-weight:800;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.2);

}

/* =========================
   LEAFLET
========================= */

.leaflet-control-zoom{
  border:none !important;
}

.leaflet-control-zoom a{

  background:
    rgba(45,106,79,0.96) !important;

  color:white !important;

  border:none !important;

}

.leaflet-popup-content-wrapper{

  background:#1B4332;

  color:white;

  border-radius:18px;

}

.leaflet-popup-tip{
  background:#1B4332;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .legend{

    bottom:300px;

    max-width:150px;

  }

  .sheet-title{
    font-size:20px;
  }

}

</style>
</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<div id="splashScreen">

  <div class="splash-glow"></div>

  <div class="logo-top">

    <!-- GANTI NANTI -->
    <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png">

  </div>

  <div class="app-title">
    KLEPON-GO
  </div>

  <div class="app-subtitle">
    Viewer Wilkerstat Kota Pontianak
  </div>

  <div class="loading-container">

    <div class="loading-bar-bg">
      <div class="loading-bar" id="loadingBar"></div>
    </div>

    <div class="loading-text" id="loadingText">
      Initializing map...
    </div>

    <div class="loading-percent" id="loadingPercent">
      0%
    </div>

  </div>

  <div class="logo-bottom">

    <!-- GANTI NANTI -->
    <img
      src="https://upload.wikimedia.org/wikipedia/commons/2/28/Lambang_BPS_%28indonesia%29.svg"
      width="50"
    >

  </div>

</div>

<div id="map"></div>

<!-- =========================
     TOP UI
========================= -->

<div class="top-ui">

  <div class="filter-card">

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari IDSLS / IDSUBSLS / Nama SLS"
      >

    </div>

    <div class="filter-group">

      <select
        class="filter-select"
        id="kecamatanFilter"
      >
        <option value="">
          Semua Kecamatan
        </option>
      </select>

      <select
        class="filter-select"
        id="kelurahanFilter"
      >
        <option value="">
          Semua Kelurahan
        </option>
      </select>

    </div>

  </div>

</div>

<!-- =========================
     FLOAT BUTTONS
========================= -->

<div class="floating-buttons">

  <button
    class="float-btn"
    onclick="locateUser()"
  >
    <i class="fa-solid fa-location-crosshairs"></i>
  </button>

  <button
    class="float-btn"
    onclick="resetFilters()"
  >
    <i class="fa-solid fa-rotate-right"></i>
  </button>

</div>

<!-- =========================
     LEGEND
========================= -->

<div class="legend">

  <div class="legend-title">
    Warna Kecamatan
  </div>

  <div id="legendItems"></div>

</div>

<!-- =========================
     BOTTOM SHEET
========================= -->

<div class="bottom-sheet">

  <div class="drag-line"></div>

  <div class="badge">

    <i class="fa-solid fa-map-location-dot"></i>

    KLEPON-GO ACTIVE

  </div>

  <div
    class="sheet-title"
    id="sheetTitle"
  >
    Belum ada wilayah dipilih
  </div>

  <div class="info-grid">

    <div class="info-card">

      <div class="info-label">
        IDSLS
      </div>

      <div
        class="info-value"
        id="idsls"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        IDSUBSLS
      </div>

      <div
        class="info-value"
        id="idsubsls"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        Kecamatan
      </div>

      <div
        class="info-value"
        id="kecamatan"
      >
        -
      </div>

    </div>

    <div class="info-card">

      <div class="info-label">
        Kelurahan
      </div>

      <div
        class="info-value"
        id="kelurahan"
      >
        -
      </div>

    </div>

  </div>

  <button
    class="direction-btn"
    onclick="navigateToPolygon()"
  >

    <i class="fa-solid fa-route"></i>

    Arahkan Saya

  </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   SPLASH
========================= */

const loadingSteps = [

  "Initialize map...",
  "Load basemap...",
  "Load GeoJSON...",
  "Generate polygons...",
  "Apply styles...",
  "Finalize interface..."

];

let progress = 0;

const splashInterval = setInterval(() => {

  progress += 15;

  if(progress > 100){
    progress = 100;
  }

  document
    .getElementById("loadingBar")
    .style.width = progress + "%";

  document
    .getElementById("loadingPercent")
    .innerText = progress + "%";

  const stepIndex =
    Math.min(
      Math.floor(progress / 20),
      loadingSteps.length - 1
    );

  document
    .getElementById("loadingText")
    .innerText = loadingSteps[stepIndex];

  if(progress >= 100){

    clearInterval(splashInterval);

    setTimeout(() => {

      document
        .getElementById("splashScreen")
        .style.display = "none";

    },600);

  }

},400);

/* =========================
   MAP
========================= */

const map = L.map('map')
.setView([-0.0263,109.3425],12);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

/* =========================
   VARIABLES
========================= */

let allData;
let geojsonLayer;
let selectedCenter = null;

const colors = [
  "#95D5B2",
  "#74C69D",
  "#B7E4C7",
  "#D8F3DC",
  "#9C6644",
  "#A47148",
  "#B08968"
];

const kecamatanColorMap = {};
const kelurahanColorMap = {};

/* =========================
   LOAD GEOJSON
========================= */

fetch('final_subsls_6171_2025-1.geojson')

.then(res => res.json())

.then(data => {

  allData = data;

  populateKecamatan();

  renderGeoJSON(allData.features);

});

/* =========================
   COLOR HELPER
========================= */

function getColor(mapObj,key){

  if(!mapObj[key]){

    const index =
      Object.keys(mapObj).length
      % colors.length;

    mapObj[key] = colors[index];

  }

  return mapObj[key];

}

/* =========================
   RENDER
========================= */

function renderGeoJSON(features){

  if(geojsonLayer){
    map.removeLayer(geojsonLayer);
  }

  geojsonLayer = L.geoJSON(features,{

    style:feature => {

      const props = feature.properties;

      const selectedKecamatan =
        document
        .getElementById("kecamatanFilter")
        .value;

      let fill;

      if(selectedKecamatan){

        fill =
          getColor(
            kelurahanColorMap,
            props.nmkel
          );

      }else{

        fill =
          getColor(
            kecamatanColorMap,
            props.nmkec
          );

      }

      return{

        color:"#D8F3DC",
        weight:1,

        fillColor:fill,
        fillOpacity:0.45

      };

    },

    onEachFeature:(feature,layer)=>{

      layer.on('click',()=>{

        selectPolygon(feature,layer);

      });

    }

  }).addTo(map);

  updateLegend(features);

}

/* =========================
   SELECT POLYGON
========================= */

function selectPolygon(feature,layer){

  const props = feature.properties;

  document
    .getElementById("sheetTitle")
    .innerText =
      props.nmsls || "-";

  document
    .getElementById("idsls")
    .innerText =
      props.idsls || "-";

  document
    .getElementById("idsubsls")
    .innerText =
      props.idsubsls || "-";

  document
    .getElementById("kecamatan")
    .innerText =
      props.nmkec || "-";

  document
    .getElementById("kelurahan")
    .innerText =
      props.nmkel || "-";

  selectedCenter =
    layer.getBounds().getCenter();

  map.fitBounds(
    layer.getBounds(),
    {
      padding:[40,40]
    }
  );

}

/* =========================
   KECAMATAN
========================= */

function populateKecamatan(){

  const set = new Set();

  allData.features.forEach(f => {

    set.add(
      f.properties.nmkec
    );

  });

  const select =
    document
    .getElementById("kecamatanFilter");

  [...set]
  .sort()
  .forEach(kec => {

    const option =
      document.createElement("option");

    option.value = kec;
    option.textContent = kec;

    select.appendChild(option);

  });

}

/* =========================
   FILTER KECAMATAN
========================= */

document
.getElementById("kecamatanFilter")
.addEventListener("change",function(){

  const value = this.value;

  const kelSelect =
    document
    .getElementById("kelurahanFilter");

  kelSelect.innerHTML =
    `<option value="">
      Semua Kelurahan
    </option>`;

  if(!value){

    renderGeoJSON(allData.features);

    map.setView(
      [-0.0263,109.3425],
      12
    );

    return;

  }

  const filtered =
    allData.features.filter(f =>

      f.properties.nmkec === value

    );

  renderGeoJSON(filtered);

  const temp =
    L.geoJSON(filtered);

  map.fitBounds(
    temp.getBounds()
  );

  const kelSet = new Set();

  filtered.forEach(f => {

    kelSet.add(
      f.properties.nmkel
    );

  });

  [...kelSet]
  .sort()
  .forEach(kel => {

    const option =
      document.createElement("option");

    option.value = kel;
    option.textContent = kel;

    kelSelect.appendChild(option);

  });

});

/* =========================
   FILTER KELURAHAN
========================= */

document
.getElementById("kelurahanFilter")
.addEventListener("change",function(){

  const kec =
    document
    .getElementById("kecamatanFilter")
    .value;

  const kel = this.value;

  if(!kel){

    const filtered =
      allData.features.filter(f =>

        f.properties.nmkec === kec

      );

    renderGeoJSON(filtered);

    return;

  }

  const filtered =
    allData.features.filter(f =>

      f.properties.nmkec === kec &&
      f.properties.nmkel === kel

    );

  renderGeoJSON(filtered);

  const temp =
    L.geoJSON(filtered);

  map.fitBounds(
    temp.getBounds()
  );

});

/* =========================
   SEARCH
========================= */

document
.getElementById("searchInput")
.addEventListener("keyup",function(){

  const keyword =
    this.value.toLowerCase();

  geojsonLayer.eachLayer(layer => {

    const props =
      layer.feature.properties;

    const idsls =
      String(props.idsls || "")
      .toLowerCase();

    const idsubsls =
      String(props.idsubsls || "")
      .toLowerCase();

    const nama =
      String(props.nmsls || "")
      .toLowerCase();

    if(

      idsls.includes(keyword) ||
      idsubsls.includes(keyword) ||
      nama.includes(keyword)

    ){

      selectPolygon(
        layer.feature,
        layer
      );

    }

  });

});

/* =========================
   GPS
========================= */

function locateUser(){

  navigator.geolocation
  .getCurrentPosition(pos => {

    const lat =
      pos.coords.latitude;

    const lng =
      pos.coords.longitude;

    map.setView(
      [lat,lng],
      16
    );

    L.circleMarker(
      [lat,lng],
      {

        radius:8,

        color:"#ffffff",

        weight:3,

        fillColor:"#2D6A4F",

        fillOpacity:1

      }

    ).addTo(map);

  });

}

/* =========================
   RESET
========================= */

function resetFilters(){

  document
    .getElementById("kecamatanFilter")
    .value = "";

  document
    .getElementById("kelurahanFilter")
    .innerHTML =
      `<option value="">
        Semua Kelurahan
      </option>`;

  document
    .getElementById("searchInput")
    .value = "";

  renderGeoJSON(allData.features);

  map.setView(
    [-0.0263,109.3425],
    12
  );

}

/* =========================
   NAVIGATION
========================= */

function navigateToPolygon(){

  if(!selectedCenter){

    alert(
      "Pilih polygon terlebih dahulu"
    );

    return;

  }

  const lat =
    selectedCenter.lat;

  const lng =
    selectedCenter.lng;

  window.open(

    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,

    "_blank"

  );

}

/* =========================
   LEGEND
========================= */

function updateLegend(features){

  const selectedKecamatan =
    document
    .getElementById("kecamatanFilter")
    .value;

  const legend =
    document
    .getElementById("legendItems");

  legend.innerHTML = "";

  const unique = {};

  features.forEach(f => {

    const props =
      f.properties;

    let key;
    let color;

    if(selectedKecamatan){

      key = props.nmkel;

      color =
        getColor(
          kelurahanColorMap,
          props.nmkel
        );

    }else{

      key = props.nmkec;

      color =
        getColor(
          kecamatanColorMap,
          props.nmkec
        );

    }

    unique[key] = color;

  });

  Object.entries(unique)
  .forEach(([name,color]) => {

    const div =
      document.createElement("div");

    div.className =
      "legend-item";

    div.innerHTML = `

      <div
        class="legend-color"
        style="background:${color}"
      ></div>

      <span>${name}</span>

    `;

    legend.appendChild(div);

  });

}

</script>

</body>
</html>
